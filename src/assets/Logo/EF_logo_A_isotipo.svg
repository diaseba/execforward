<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>ExecForward — Isotipo</title>
  <desc>Símbolo de Avance Horizontal: barras azules + chevrones teal</desc>
  <!-- Barras azules: sistema / metodología -->
  <rect x="40" y="44" width="72" height="16" rx="3" fill="#2563EB"/>
  <rect x="40" y="66" width="72" height="16" rx="3" fill="#2563EB"/>
  <rect x="40" y="88" width="72" height="16" rx="3" fill="#2563EB"/>
  <rect x="40" y="110" width="72" height="16" rx="3" fill="#2563EB"/>
  <rect x="40" y="132" width="72" height="16" rx="3" fill="#2563EB"/>
  <!-- Chevron 1: 100% teal -->
  <polygon points="113,44 133,100 113,156 124,156 144,100 124,44" fill="#14B8A6"/>
  <!-- Chevron 2: 70% teal -->
  <polygon points="136,44 156,100 136,156 147,156 167,100 147,44" fill="#14B8A6" opacity="0.70"/>
  <!-- Chevron 3: 40% teal -->
  <polygon points="159,44 179,100 159,156 170,156 190,100 170,44" fill="#14B8A6" opacity="0.40"/>
</svg>
